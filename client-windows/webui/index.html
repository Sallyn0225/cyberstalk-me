<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- Matched to the page background in each mode, so the browser's own
         surrounding chrome does not sit at a different brightness. -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <title>配置 cyberstalk-me 客户端</title>
    <!--
      The agent replaces the placeholder below with this session's token before
      serving the page. Keeping the token out of the URL keeps it out of browser
      history and out of any Referer the page might later send.
    -->
    <script>
      window.__SETUP_TOKEN__ = "__SETUP_TOKEN_PLACEHOLDER__";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
