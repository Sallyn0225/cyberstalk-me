# cyberstalk-me — single-container deployment.
#
#   docker compose up -d
#
# pulls the prebuilt image from GHCR; `docker compose build` builds the same
# image locally instead. Copy .env.example to .env to change any of the
# defaults below — without a .env file the defaults apply as-is.
#
# TLS / reverse proxying is deliberately left to the deployer; see the
# "Reverse proxy" section of README.md (the SSE stream must not be buffered).

services:
  app:
    image: ghcr.io/sallyn0225/cyberstalk-me:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      # The container always listens on 8080; only the host side is tunable,
      # so the health check and the port mapping cannot drift apart.
      - "${HOST_PORT:-8080}:8080"
    environment:
      OFFLINE_THRESHOLD: ${OFFLINE_THRESHOLD:-60s}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-5s}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Asia/Shanghai}
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-365}
      USAGE_PRUNE_INTERVAL: ${USAGE_PRUNE_INTERVAL:-1h}
      # Empty means "follow OFFLINE_THRESHOLD"; the server resolves the
      # default, so there is nothing to keep in sync here.
      USAGE_MAX_GAP: ${USAGE_MAX_GAP:-}
    volumes:
      # The SQLite database is the only persistent state. A named volume keeps
      # it out of reach of host permission quirks and survives `down` + `up`.
      - cyberstalk-data:/data
    logging:
      # The server logs to stdout, so the container log file is the only thing
      # here that grows without bound — json-file has no size limit by default
      # and a long-running deployment can fill the disk with it. Capping it is
      # a retention policy, not a debugging tradeoff: max-file rotations of
      # max-size each are kept, older ones are dropped.
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    healthcheck:
      # /api/v1/snapshot rather than / — it reads the store, so a green check
      # means "serving and the database is readable", not just "files exist".
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/snapshot"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  cyberstalk-data:
