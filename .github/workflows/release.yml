name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Skips the rolling `edge` rebuild for commits that cannot change the
    # image. Safe to combine with the tag trigger above: GitHub does not
    # evaluate path filters for tag pushes, so a release is never filtered out.
    paths-ignore:
      - ".trellis/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build & push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # No docker/setup-qemu-action on purpose: the runtime stage of the
      # Dockerfile has zero RUN instructions and the Go build cross-compiles,
      # so nothing ever executes on the target architecture. If a RUN is ever
      # added to the runtime stage, QEMU setup has to be added back here.

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Lowercased automatically — GHCR rejects uppercase paths and the
          # repository owner is "Sallyn0225".
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
